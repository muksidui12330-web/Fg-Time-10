name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version Information ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"

          if [ -z "$JAVA_HOME" ]; then
            echo "::error::JAVA_HOME is not set."
            exit 1
          fi

          JAVA_VERSION_OUTPUT=$(java -version 2>&1)
          MAJOR_VERSION=$(echo "$JAVA_VERSION_OUTPUT" | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print $1}')

          if [ -z "$MAJOR_VERSION" ]; then
            echo "::error::Unable to detect active Java major version."
            exit 1
          fi

          echo "Detected Java major version: $MAJOR_VERSION"

          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "::error::Active Java major version is $MAJOR_VERSION, which is lower than required version 17."
            exit 1
          fi

          echo "Java environment verified successfully (version $MAJOR_VERSION >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists. Skipping creation."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000

            if [ ! -f "./debug.keystore" ]; then
              echo "::error::Failed to create ./debug.keystore."
              exit 1
            fi
            echo "Temporary debug keystore created successfully."
          fi

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK not found at $EXPECTED_APK."
            echo "Searching app/build/outputs/apk for generated APK files:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::APK file $EXPECTED_APK exists but is empty (0 bytes)."
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "::error::$EXPECTED_APK does not have the .apk extension."
              exit 1
              ;;
          esac

          echo "Verified debug APK at $EXPECTED_APK ($(stat -c%s "$EXPECTED_APK") bytes)."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          TEMP_RELEASE_DIR="$RUNNER_TEMP/release-asset"
          mkdir -p "$TEMP_RELEASE_DIR"

          RAW_REPO_NAME="${{ github.repository }}"
          REPO_NAME=$(echo "$RAW_REPO_NAME" | awk -F/ '{print $2}' | tr -cd 'a-zA-Z0-9._-')
          if [ -z "$REPO_NAME" ]; then
            REPO_NAME="app"
          fi

          ASSET_NAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          TARGET_PATH="$TEMP_RELEASE_DIR/$ASSET_NAME"

          cp "$SOURCE_APK" "$TARGET_PATH"

          if [ ! -f "$TARGET_PATH" ] || [ ! -s "$TARGET_PATH" ]; then
            echo "::error::Failed to prepare release asset at $TARGET_PATH."
            exit 1
          fi

          echo "Prepared release asset: $TARGET_PATH"
          echo "asset_path=$TARGET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking GitHub CLI availability..."
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ ! -f "$ASSET_PATH" ]; then
            echo "::error::Prepared release asset $ASSET_PATH does not exist."
            exit 1
          fi

          if [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Prepared release asset $ASSET_PATH is empty."
            exit 1
          fi

          case "$ASSET_NAME" in
            *.apk) ;;
            *)
              echo "::error::Release asset $ASSET_NAME is not an APK file."
              exit 1
              ;;
          esac

          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"

          NOTES_FILE="$RUNNER_TEMP/release_notes.md"
          cat << 'EOF' > "$NOTES_FILE"
          ### FG TIME — Automated Debug APK Build

          This release contains the automatically compiled debug APK for testing.

          - **Build Type:** Automated Debug APK
          - **Built By:** GitHub Actions
          - **Run Number:** ${{ github.run_number }}
          - **Run Attempt:** ${{ github.run_attempt }}
          - **Source Commit:** `${{ github.sha }}`
          - **Keystore:** Signed with temporary debug keystore
          - **Notice:** This APK is intended for testing and verification. It is not an official Play Store production release.
          EOF

          echo "Creating GitHub Release with tag: $TAG_NAME"
          gh release create "$TAG_NAME" \
            "$ASSET_PATH" \
            --title "$TITLE" \
            --notes-file "$NOTES_FILE" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_OUTCOME="${{ steps.create_release.outcome }}"
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "=== GitHub Release Successfully Published ==="
            echo "Release Tag: $TAG_NAME"
            echo "Asset Name: $ASSET_NAME"

            RELEASE_URL=$(gh release view "$TAG_NAME" --json url -q .url 2>/dev/null || echo "https://github.com/${{ github.repository }}/releases/tag/$TAG_NAME")
            echo "Release Page: $RELEASE_URL"

            {
              echo "### 🚀 Debug APK Published to GitHub Releases"
              echo ""
              echo "- **Release Tag:** \`$TAG_NAME\`"
              echo "- **APK Filename:** \`$ASSET_NAME\`"
              echo "- **Release URL:** [$RELEASE_URL]($RELEASE_URL)"
              echo ""
              echo "You can download the APK directly onto your Android device from the **Assets** section of the release above."
              echo ""
              echo "> **Backup Artifact:** The standard GitHub Actions artifact named \`app-debug-apk\` is also stored under this run's Artifacts section."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release creation did not complete successfully."
            echo "The debug APK build and artifact upload succeeded."
            echo "You can download the compiled APK from the GitHub Actions Artifacts section (named 'app-debug-apk')."

            {
              echo "### ⚠️ Debug APK Build Succeeded (Release Publishing Notice)"
              echo ""
              echo "- **Build Status:** Debug APK compiled successfully."
              echo "- **Actions Artifact:** The APK was uploaded and is available under the **Artifacts** section of this workflow run as \`app-debug-apk\`."
              echo "- **GitHub Release Notice:** Release publishing did not complete or was skipped. Please download the APK from the GitHub Actions Artifacts list."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
